name: CI

on:
  pull_request:

jobs:
  checkstyle_job:
    runs-on: ubuntu-latest
    name: Checkstyle
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run check style
        uses: nikitasavinov/checkstyle-action@188701a3b260206eeb3048e2b6e2af2c47d0876f # master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: "github-pr-check"
          tool_name: "testtool"
          checkstyle_config: "checkstyle.xml"
          level: error
          fail_on_error: true

  build:
    strategy:
      matrix:
        java: [8, 11, 15, 17, 20]
      max-parallel: 1
    name: Build ${{ matrix.java }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: "zulu"
          java-version: ${{ matrix.java }}
          check-latest: true
          cache: "maven"
          server-id: ossrh

      - name: Maven Build
        run: mvn -B -ntp package '-Dtest=*,!%regex[#testFunctional.*],!FGALiveTest'

  verify:
    name: Verify Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: "zulu"
          java-version: "11"
          check-latest: true
          cache: "maven"

      - run: mvn -B -ntp -P ci verify -DskipTests -Dgpg.skip
